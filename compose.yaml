# Production-like stack: `docker compose up -d --build`, then open http://localhost:8080
name: loopboard
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: loopboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loopboard}
      POSTGRES_DB: loopboard
    volumes: [db:/var/lib/postgresql]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U loopboard']
      interval: 3s
      retries: 20

  server:
    build: { context: ., dockerfile: apps/server/Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://loopboard:${POSTGRES_PASSWORD:-loopboard}@db:5432/loopboard
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET (openssl rand -base64 32)}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Only for automated end-to-end test runs against this stack.
      DISABLE_RATE_LIMIT: ${DISABLE_RATE_LIMIT:-false}
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - '${HTTP_PORT:-8080}:80'
      - '${HTTPS_PORT:-8443}:443'
    volumes: [caddy:/data]
    depends_on:
      server: { condition: service_healthy }

volumes:
  db: {}
  caddy: {}
